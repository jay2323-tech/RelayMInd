[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "relaymind"
version = "0.1.0"
description = "Graph-backed memory and coordination for agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "falkordb>=1,<2",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
employee-import = ["openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
