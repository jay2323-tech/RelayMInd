services:
  falkordb:
    # Pinned 2026-10-16: multi-arch (amd64 + arm64) index, FalkorDB graph module 4.22.1.
    # Change only together with re-running the checks in docs/verification.md.
    image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3000:3000"
    environment:
      REDIS_ARGS: "--appendonly yes --requirepass ${FALKORDB_PASSWORD:?Set FALKORDB_PASSWORD in .env}"
    volumes:
      # This image stores data in /var/lib/falkordb/data (/data is only a symlink to it).
      # Mounting /data persisted nothing; fixed 2026-10-17.
      - falkordb-data:/var/lib/falkordb/data
    restart: unless-stopped
volumes:
  falkordb-data:
